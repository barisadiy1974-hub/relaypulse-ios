# Builds, signs and uploads the app to App Store Connect (TestFlight) from a
# cloud Mac. Started by pushing a tag testflight-<version>-<build> (or by hand
# from Actions once this file is on main). Nothing goes to
# App Review: the build lands in TestFlight, where internal testers (the
# account owner) install it. Submitting for review stays a separate, manual
# step in App Store Connect.
#
# Signing is Xcode's automatic (cloud) signing with an App Store Connect API
# key, so no certificate or profile is kept here. Repository secrets:
#   ASC_KEY_ID      the key's Key ID
#   ASC_ISSUER_ID   the Issuer ID shown above the keys list
#   ASC_KEY_P8      the whole AuthKey_XXXX.p8 file
# The key needs the Admin role (cloud-managed distribution certificate).
name: TestFlight

on:
  workflow_dispatch:
  push:
    tags: ["testflight-*"]

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate
      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_KEY_P8" && test -n "$ASC_KEY_ID" || { echo "ASC_KEY_ID / ASC_KEY_P8 secrets are missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Archive (signed)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project RelayPulse.xcodeproj -scheme RelayPulse \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RelayPulse.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive 2>&1 | tee /tmp/archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" /tmp/archive.log
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RelayPulse.xcarchive" \
            -exportOptionsPlist ExportOptions-upload.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee /tmp/export.log | grep -E "error|Upload|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" /tmp/export.log
      - name: Log on failure
        if: failure()
        run: grep -h -E "error|Signing|provision|certificate" /tmp/archive.log /tmp/export.log 2>/dev/null | sort -u | head -60 || true
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
