name: RelayPulse
options:
  bundleIdPrefix: com.baris
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.6"
    CURRENT_PROJECT_VERSION: "22"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: D694LXAZFQ
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    # App Store gonderimi manuel imza ister. Ayar proje seviyesinde durur;
    # SPM bagimliliklari ayri proje oldugu icin etkilenmez (komut satirindan
    # verilirse onlarla catisir ve arsivleme basarisiz olur).
    Release:
      CODE_SIGN_STYLE: Automatic

# SSH: Apple'ın resmi swift-nio-ssh'i doğrudan kullanılıyor.
# Citadel (yaygın sarmalayıcı) 0.12.1'de swift-nio-ssh'i üçüncü taraf bir
# fork'tan (github.com/Wellz26) çekiyor — 143 relay'in SSH kimlik bilgilerini
# taşıyan bir uygulamada bilinmeyen bir SSH implementasyonuna güvenilmez.
packages:
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh.git
    from: "0.9.0"

# Simulatorde satin almayi denemek icin StoreKit test dosyasi. Sadece Run'a
# bagli; Archive (Release) gercek App Store urununu kullanir.
schemes:
  RelayPulse:
    build:
      targets:
        RelayPulse: all
        RelayPulseWidget: all
    run:
      config: Debug
      storeKitConfiguration: RelayPulse.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  RelayPulse:
    type: application
    platform: iOS
    dependencies:
      - package: swift-nio-ssh
        product: NIOSSH
      - target: RelayPulseWidget
    sources:
      - path: RelayPulse
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baris.relaypulse
        PRODUCT_NAME: RelayPulse
        INFOPLIST_FILE: RelayPulse/Info.plist
        CODE_SIGN_ENTITLEMENTS: RelayPulse/RelayPulse.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
      configs:
        Release:
          CODE_SIGN_STYLE: Automatic
          # App Store derlemesi production APNs ister; gelistirme derlemesi
          # sandbox'ta kalir. Yanlis eslesmede push sessizce calismaz.
          CODE_SIGN_ENTITLEMENTS: RelayPulse/RelayPulse-Release.entitlements

  RelayPulseWidget:
    type: app-extension
    platform: iOS
    # 16.1, not 16.0: ActivityConfiguration (Live Activity) starts there.
    deploymentTarget: "16.1"
    sources:
      - path: RelayPulseWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baris.relaypulse.widget
        PRODUCT_NAME: RelayPulseWidget
        INFOPLIST_FILE: RelayPulseWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: RelayPulseWidget/RelayPulseWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
