name: RelayPulse
options:
  bundleIdPrefix: com.baris
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.5"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: D694LXAZFQ
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# SSH: Apple'ın resmi swift-nio-ssh'i doğrudan kullanılıyor.
# Citadel (yaygın sarmalayıcı) 0.12.1'de swift-nio-ssh'i üçüncü taraf bir
# fork'tan (github.com/Wellz26) çekiyor — 143 relay'in SSH kimlik bilgilerini
# taşıyan bir uygulamada bilinmeyen bir SSH implementasyonuna güvenilmez.
packages:
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh.git
    from: "0.9.0"

targets:
  RelayPulse:
    type: application
    platform: iOS
    dependencies:
      - package: swift-nio-ssh
        product: NIOSSH
    sources:
      - path: RelayPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baris.relaypulse
        PRODUCT_NAME: RelayPulse
        INFOPLIST_FILE: RelayPulse/Info.plist
        CODE_SIGN_ENTITLEMENTS: RelayPulse/RelayPulse.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
